<!DOCTYPE html>
<html>

<head>
</head>

<body>
    <canvas id='cnvs'></canvas>
    <input type="text" id="seed" placeholder="Seed">
    <button onclick="draw()">Generate</button>
    <script> //Perlin Script
        'use strict';
        let perlin = {
            seed: Math.random() + Math.random() * 10,
            gradients: {},
            memory: {},
            seedify: function (str) {
                let h = 2166136261;
                for (let i = 0; i < str.length; i++) {
                    h ^= str.charCodeAt(i);
                    h = Math.imul(h, 16777619);
                }
                return h >>> 0;
            },
            rand: function () {
                if (typeof this.seed === "string") {
                    this.seed = this.seedify(this.seed);
                }
                this.seed = (this.seed + 0x6D2B79F5) >>> 0;
                let t = this.seed;
                let r = Math.imul(t ^ (t >>> 15), t | 1);
                r ^= r + Math.imul(r ^ (r >>> 7), r | 61);
                return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
            },
            rand_vect: function () {
                const theta = this.rand() * Math.PI * 2;
                return {
                    x: Math.cos(theta),
                    y: Math.sin(theta)
                }
            },
            dot_prod_grid: function (x, y, vx, vy) {
                let g_vect;
                let d_vect = { x: x - vx, y: y - vy };
                if (this.gradients[[vx, vy]]) {
                    g_vect = this.gradients[[vx, vy]];
                } else {
                    g_vect = this.rand_vect();
                    this.gradients[[vx, vy]] = g_vect;
                }
                return d_vect.x * g_vect.x + d_vect.y * g_vect.y;
            },
            smootherstep: function (x) {
                return 6 * x ** 5 - 15 * x ** 4 + 10 * x ** 3;
            },
            interp: function (x, a, b) {
                return a + this.smootherstep(x) * (b - a);
            },
            clearMemory: function () {
                this.gradients = {};
                this.memory = {};
            },
            get: function (x, y) {
                if (this.memory.hasOwnProperty([x, y]))
                    return this.memory[[x, y]];
                let xf = Math.floor(x);
                let yf = Math.floor(y);
                //interpolate
                let tl = this.dot_prod_grid(x, y, xf, yf);
                let tr = this.dot_prod_grid(x, y, xf + 1, yf);
                let bl = this.dot_prod_grid(x, y, xf, yf + 1);
                let br = this.dot_prod_grid(x, y, xf + 1, yf + 1);
                let xt = this.interp(x - xf, tl, tr);
                let xb = this.interp(x - xf, bl, br);
                let v = this.interp(y - yf, xt, xb);
                this.memory[[x, y]] = v;
                return v;
            }
        }
        perlin.clearMemory();
    </script>
    <script> //Demo Script
        'use strict';
        let cnvs = document.getElementById('cnvs');
        cnvs.width = cnvs.height = 512;
        let ctx = cnvs.getContext('2d');

        const GRID_SIZE = 4;
        const RESOLUTION = 128;
        const COLOR_SCALE = 250;

        let pixel_size = cnvs.width / RESOLUTION;
        let num_pixels = GRID_SIZE / RESOLUTION;

        for (let y = 0; y < GRID_SIZE; y += num_pixels / GRID_SIZE) {
            for (let x = 0; x < GRID_SIZE; x += num_pixels / GRID_SIZE) {
                let v = parseInt(perlin.get(x, y) * COLOR_SCALE);
                ctx.fillStyle = 'hsl(' + v + ',50%,50%)';
                ctx.fillRect(
                    x / GRID_SIZE * cnvs.width,
                    y / GRID_SIZE * cnvs.width,
                    pixel_size,
                    pixel_size
                );
            }
        }

        function draw() {
            perlin.seed = document.getElementById('seed').value;
            perlin.clearMemory();
            for (let y = 0; y < GRID_SIZE; y += num_pixels / GRID_SIZE) {
                for (let x = 0; x < GRID_SIZE; x += num_pixels / GRID_SIZE) {
                    let v = parseInt(perlin.get(x, y) * COLOR_SCALE);
                    ctx.fillStyle = 'hsl(' + v + ',50%,50%)';
                    ctx.fillRect(
                        x / GRID_SIZE * cnvs.width,
                        y / GRID_SIZE * cnvs.width,
                        pixel_size,
                        pixel_size
                    );
                }
            }
        }
    </script>
</body>

</html>
